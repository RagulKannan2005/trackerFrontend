<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-container">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">
        <h3>JCT</h3>
        <span class="logo-subtitle">Job Coaching Tracker</span>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section-title">MAIN MENU</div>

      <div class="nav-links" routerLink="/admin/home" routerLinkActive="active">
        <span class="icon">🏠</span>
        <span class="text">Dashboard</span>
      </div>

      <div class="nav-links" routerLink="/admin/team-member" routerLinkActive="active">
        <span class="icon">👥</span>
        <span class="text">Team Member</span>
      </div>

      <div class="nav-links" routerLink="/admin/final-year" routerLinkActive="active">
        <span class="icon">🎓</span>
        <span class="text">Final Year</span>
        <span class="nav-badge blue">320</span>
      </div>

      <div class="nav-links" routerLink="/admin/courseinfo">
        <span class="icon">📚</span>
        <span class="text">Course Topic Info</span>
      </div>

      <!-- Trackers Accordion Item -->
      <div class="nav-accordion" [class.expanded]="isTrackerOpen">
        <div
          class="nav-links nav-accordion-header"
          (click)="toggleTrackerMenu($event)"
          routerLink="/admin/trackers"
        >
          <span class="icon">📈</span>
          <span class="text">Trackers</span>
          <span class="nav-badge green">Manage</span>
        </div>
      </div>

      <div class="nav-links" routerLink="/admin/sections" routerLinkActive="active">
        <span class="icon">📁</span>
        <span class="text">Sections</span>
      </div>

      <div class="nav-links" routerLink="/admin/skills" routerLinkActive="active">
        <span class="icon">⚡</span>
        <span class="text">Skills</span>
      </div>

      <div class="nav-section-title">MANAGEMENT</div>

      <div class="nav-links">
        <span class="icon">🛠️</span>
        <span class="text">Resources</span>
      </div>

      <div class="nav-links">
        <span class="icon">🙋🏻‍♂️</span>
        <span class="text">Attendance</span>
      </div>

      <div class="nav-links">
        <span class="icon">👔</span>
        <span class="text">Experienced People</span>
      </div>

      <div class="nav-links">
        <span class="icon">🎯</span>
        <span class="text">Goals</span>
      </div>

      <div class="nav-links" routerLink="/admin/meetings" routerLinkActive="active">
        <span class="icon">🗓️</span>
        <span class="text">Meetings</span>
      </div>

      <div class="nav-links">
        <span class="icon">⚙️</span>
        <span class="text">Settings</span>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="avatar">RK</div>
        <div class="user-info">
          <span class="user-name">Ragul Kannan</span>
          <span class="user-role">{{ Authservice.getrole() }}</span>
        </div>
      </div>
      <div class="nav-links logout" (click)="Authservice.logout()">
        <span class="icon">🚪</span>
        <span class="text">Logout</span>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
